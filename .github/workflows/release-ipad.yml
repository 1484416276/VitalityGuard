name: release-ipad

on:
  push:
    tags:
      - "v*-ipad"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Debug - List directory structure
        run: |
          echo "=== Root directory ==="
          ls -la
          echo ""
          echo "=== Looking for .xcodeproj ==="
          find . -name "*.xcodeproj" -type d 2>/dev/null
          echo ""
          echo "=== Looking for .xcworkspace ==="
          find . -name "*.xcworkspace" -type d 2>/dev/null
          echo ""
          echo "=== Looking for .swift files ==="
          find . -name "*.swift" -type f 2>/dev/null | head -20

      - name: Build for iOS Simulator
        id: build
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -z "$tag" ] || [ "$tag" = "" ]; then tag="dev"; fi
          version=$(echo "$tag" | sed 's/-ipad$//')
          
          PROJECT_PATH=$(find . -name "*.xcodeproj" -type d | head -1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No .xcodeproj found!"
            exit 1
          fi
          
          echo "Found project at: $PROJECT_PATH"
          
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          
          echo "Project directory: $PROJECT_DIR"
          echo "Project name: $PROJECT_NAME"
          
          cd "$PROJECT_DIR"
          
          xcodebuild -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPad Pro (12.9-inch) (6th generation)' \
            -derivedDataPath ../build \
            build \
            2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Build failed!"
            tail -200 build.log
            exit 1
          fi
          
          echo "Build succeeded!"
          find ../build -name "*.app" 2>/dev/null

      - name: Create IPA from Simulator Build
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(echo "$tag" | sed 's/-ipad$//')
          
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "App not found!"
            find build -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          
          ipa_name="VitalityGuard-${version}-ipad.ipa"
          ipa_path="dist/${ipa_name}"
          mkdir -p dist
          cd build
          zip -r "../${ipa_path}" Payload
          
          hash=$(shasum -a 256 "../${ipa_path}" | cut -d' ' -f1)
          
          echo "ipa_path=${ipa_path}" >> $GITHUB_OUTPUT
          echo "ipa_name=${ipa_name}" >> $GITHUB_OUTPUT
          echo "sha256=${hash}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Verify artifacts
        run: |
          ls -la dist/
          file dist/*.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.ipa_name }}
          path: ${{ steps.build.outputs.ipa_path }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.ipa_path }}
          name: VitalityGuard ${{ steps.build.outputs.version }} (iPad)
          tag_name: ${{ github.ref_name }}
          body: |
            iPad/iOS build (Simulator version).
            
            SHA256: ${{ steps.build.outputs.sha256 }}
            
            ## Installation
            This is a simulator build. For device installation, please use Xcode to build and deploy to your iPad.
            
            ### Method 1: Xcode (Recommended)
            1. Clone the repository
            2. Open VitalityGuard.xcodeproj in Xcode
            3. Connect your iPad
            4. Select your iPad as the destination
            5. Press Cmd+R to build and run
            
            ## Features
            - Work/Rest cycle timer
            - Night rest mode
            - Health tasks during rest (eye exercises, stretches)
            - Guided Access support for device lockdown
            - Multi-language support (Chinese/English)
