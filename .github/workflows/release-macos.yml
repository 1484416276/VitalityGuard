name: release-macos

on:
  push:
    tags:
      - "v*-macos"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          brew install python-tk@3.12 || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller --noconfirm --clean VitalityGuardMacOS.spec

      - name: Create DMG
        id: dmg
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -z "$tag" ] || [ "$tag" = "" ]; then tag="dev"; fi
          version=$(echo "$tag" | sed 's/-macos$//')
          
          app_path="dist/VitalityGuard.app"
          if [ ! -d "$app_path" ]; then
            echo "Missing build output: $app_path"
            ls -la dist/ || true
            exit 1
          fi
          
          dmg_name="VitalityGuard-${version}-macos-arm64.dmg"
          dmg_path="dist/${dmg_name}"
          
          hdiutil create -volname "VitalityGuard" -srcfolder "$app_path" -ov -format UDZO "$dmg_path"
          
          hash=$(shasum -a 256 "$dmg_path" | cut -d' ' -f1)
          
          echo "dmg_path=$dmg_path" >> $GITHUB_OUTPUT
          echo "dmg_name=$dmg_name" >> $GITHUB_OUTPUT
          echo "sha256=$hash" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Verify artifacts
        run: |
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.dmg_name }}
          path: ${{ steps.dmg.outputs.dmg_path }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.dmg_path }}
          name: VitalityGuard ${{ steps.dmg.outputs.version }} (macOS)
          tag_name: ${{ github.ref_name }}
          body: |
            macOS ARM64 (Apple Silicon) build.
            
            SHA256: ${{ steps.dmg.outputs.sha256 }}
            
            ## Installation
            1. Download the DMG file
            2. Open the DMG and drag VitalityGuard to Applications folder
            3. Run VitalityGuard from Applications
            
            Note: On first run, you may need to allow the app in "System Preferences > Security & Privacy".
